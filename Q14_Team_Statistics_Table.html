<!DOCTYPE html>
<html>
<head>
    <title>Q14 Team Statistics</title>
    <style>
        body {
            padding: 40px;
            font-family: "Times New Roman", serif;
        }
        table {
            border-collapse: collapse;
            width: 600px;
        }
        th, td {
            border: 2px solid black;
            padding: 12px;
            font-size: 26px;
            text-align: center;
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Team</th>
        <th>Player</th>
        <th colspan="2">Statistics</th>
    </tr>

    <tr>
        <td rowspan="2">Team A</td>
        <td>Player 1</td>
        <td>Goals: 4</td>
        <td>Assists: 7</td>
    </tr>

    <tr>
        <td>Player 2</td>
        <td>Goals: 6</td>
        <td>Assists: 5</td>
    </tr>

    <tr>
        <td rowspan="2">Team B</td>
        <td>Player 3</td>
        <td>Goals: 5</td>
        <td>Assists: 6</td>
    </tr>

    <tr>
        <td>Player 4</td>
        <td>Goals: 3</td>
        <td>Assists: 8</td>
    </tr>
</table>

</body>
</html>
