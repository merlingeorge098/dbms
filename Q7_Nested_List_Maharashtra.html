<!DOCTYPE html>
<html>
<head>
    <title>Q7 Nested List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            font-size: 18px;
            font-weight: bold;
        }
        li {
            margin: 6px;
        }
    </style>
</head>
<body>

<ul type="square">
    <li>Maharashtra
        <ul type="circle">
            <li>Pune
                <ol type="I">
                    <li>Dighi</li>
                    <li>Moshi</li>
                    <li>Shivajinagar</li>
                </ol>
            </li>

            <li>Mumbai
                <ol type="I">
                    <li>Santakruiz</li>
                    <li>Vikroli</li>
                    <li>Mumbra</li>
                </ol>
            </li>
        </ul>
    </li>
</ul>

</body>
</html>
