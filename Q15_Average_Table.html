<!DOCTYPE html>
<html>
<head>
    <title>Q15 Average Table</title>
    <style>
        body {
            padding: 40px;
            font-family: "Times New Roman", serif;
        }
        table {
            border-collapse: collapse;
            background-color: #d9d9d9;
            width: 560px;
        }
        th, td {
            border: 3px solid black;
            padding: 12px;
            font-size: 26px;
            font-weight: bold;
        }
        td {
            font-weight: normal;
        }
        th {
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th rowspan="2"></th>
        <th colspan="2">Average</th>
        <th rowspan="2">Red<br>eyes</th>
    </tr>

    <tr>
        <th>height</th>
        <th>weight</th>
    </tr>

    <tr>
        <th>Males</th>
        <td>1.9</td>
        <td>0.003</td>
        <td>40%</td>
    </tr>

    <tr>
        <th>Females</th>
        <td>1.7</td>
        <td>0.002</td>
        <td>43%</td>
    </tr>
</table>

</body>
</html>
