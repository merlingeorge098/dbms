<!DOCTYPE html>
<html>
<head>
    <title>Q4 Colored Blocks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        .box {
            width: 420px;
            height: 280px;
            display: grid;
            grid-template-columns: 2fr 1fr 0.7fr;
            grid-template-rows: 3fr 2fr;
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            border: 1px solid black;
        }
        .orange {
            background-color: #ff7f45;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .blue {
            background-color: #4b00ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .red {
            background-color: red;
            grid-row: 1 / 3;
            grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .green {
            background-color: green;
            grid-row: 1 / 3;
            grid-column: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="orange">ORANGE</div>
    <div class="red">RED</div>
    <div class="green">GREEN</div>
    <div class="blue">BLUE</div>
</div>

</body>
</html>
