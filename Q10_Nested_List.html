<!DOCTYPE html>
<html>
<head>
    <title>Q10 Nested List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            font-size: 20px;
            font-weight: bold;
        }
        li {
            margin: 7px;
        }
    </style>

<body>

<ul type="circle">
    <li>Maharashtra

            <li>Pune</li>
            <li>Dighi</li>

            <li>Santakruiz</li>

            <li>Mumbra</li>
        </ol>
    </li>
</ul>
