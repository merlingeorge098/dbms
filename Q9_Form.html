<!DOCTYPE html>
<html>
<head>
    <title>Q9 Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            font-size: 20px;
        }
        .form-box {
            width: 680px;
            border: 3px solid black;
            padding: 25px;
        }
        .row {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 330px;
        }
        input[type="text"] {
            width: 300px;
            height: 30px;
            border: 2px solid black;
            font-size: 18px;
        }
        .fake-file {
            width: 350px;
            height: 32px;
            border: 2px solid black;
            display: inline-block;
            vertical-align: middle;
        }
        button {
            border: 2px solid black;
            background-color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 35px;
        }
        .checkbox-row label {
            width: auto;
            margin-right: 35px;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: white;
        }
    </style>
</head>
<body>

<form class="form-box">
    <div class="row">
        <label>Enter Name of your friend</label>
        <input type="text">
    </div>

    <div class="row">
        Choose the file you want to post to your friend
    </div>

    <div class="row">
        <span class="fake-file"></span>
        <button type="button">Browse...</button>
    </div>

    <div class="row">
        What does the file contain?
    </div>

    <div class="row checkbox-row">
        <input type="checkbox" checked>
        <label>Image</label>

        <input type="checkbox" checked>
        <label>Source code</label>

        <input type="checkbox">
        <label>Binary code</label>
    </div>

    <div class="row">
        <label>You have Completed the Form .</label>
        <button type="submit">Submit Query</button>
    </div>
</form>

</body>
</html>
