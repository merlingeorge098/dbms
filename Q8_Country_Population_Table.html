<!DOCTYPE html>
<html>
<head>
    <title>Q8 Population Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        table {
            border-collapse: collapse;
            width: 700px;
        }
        th, td {
            border: 2px solid gray;
            padding: 8px;
            font-size: 20px;
            text-align: right;
        }
        th {
            font-weight: normal;
        }
        .country {
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Country</th>
        <th colspan="2">Population (In Crores)</th>
    </tr>

    <tr>
        <td class="country" rowspan="3">INDIA</td>
        <td>1998</td>
        <td>85</td>
    </tr>
    <tr>
        <td>1999</td>
        <td>90</td>
    </tr>
    <tr>
        <td>2000</td>
        <td>100</td>
    </tr>

    <tr>
        <td class="country" rowspan="3">USA</td>
        <td>1998</td>
        <td>30</td>
    </tr>
    <tr>
        <td>1999</td>
        <td>35</td>
    </tr>
    <tr>
        <td>2000</td>
        <td>40</td>
    </tr>

    <tr>
        <td class="country" rowspan="3">UK</td>
        <td>1998</td>
        <td>25</td>
    </tr>
    <tr>
        <td>1999</td>
        <td>30</td>
    </tr>
    <tr>
        <td>2000</td>
        <td>35</td>
    </tr>
</table>

</body>
</html>
