<!DOCTYPE html>
<html>
<head>
    <title>Q13 Table</title>
    <style>
        body {
            padding: 40px;
            font-family: "Times New Roman", serif;
        }
        table {
            border-collapse: separate;
            border-spacing: 4px;
            border: 2px solid black;
            width: 900px;
        }
        th, td {
            border: 2px solid black;
            padding: 10px 25px;
            font-size: 36px;
            font-weight: normal;
        }
        th {
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Columu 1</th>
        <th>Columu 2</th>
        <th>Columu 3</th>
    </tr>

    <tr>
        <td rowspan="2">Row 1 Cell 1</td>
        <td>Row 1 Cell 2</td>
        <td>Row 1 Cell 3</td>
    </tr>

    <tr>
        <td>Row 2 Cell 2</td>
        <td>Row 2 Cell 3</td>
    </tr>

    <tr>
        <td colspan="3">Row 3 Cell 1</td>
    </tr>
</table>

</body>
</html>
