<!DOCTYPE html>
<html>
<head>
    <title>Q2 Table</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            padding: 30px;
        }
        table {
            border-collapse: collapse;
            width: 900px;
        }
        th, td {
            border: 2px solid black;
            padding: 12px;
            font-size: 18px;
        }
        th {
            text-align: center;
            font-weight: bold;
        }
        td {
            height: 45px;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th colspan="2">Name</th>
        <th>Class</th>
        <th>School</th>
    </tr>

    <tr>
        <td rowspan="2">Mahima</td>
        <td rowspan="2">Gupta</td>
        <td>11</td>
        <td rowspan="2">MVM School</td>
    </tr>
    <tr>
        <td>A</td>
    </tr>

    <tr>
        <td rowspan="2">Sri</td>
        <td rowspan="2">Krishn</td>
        <td>3</td>
        <td rowspan="2">LMS School</td>
    </tr>
    <tr>
        <td>B</td>
    </tr>

    <tr>
        <td rowspan="2">Shivika</td>
        <td rowspan="2">Goyal</td>
        <td>5</td>
        <td rowspan="2">SCPM School</td>
    </tr>
    <tr>
        <td>A</td>
    </tr>
</table>

</body>
</html>
