<!DOCTYPE html>
<html>
<head>
    <title>Q6 Frame Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            font-weight: bold;
        }
        table {
            border-collapse: collapse;
            width: 700px;
        }
        td {
            border: 2px solid white;
            padding: 15px;
            height: 70px;
            vertical-align: top;
        }
        .top {
            background-color: #ff7f2a;
        }
        .light {
            background-color: #ffd6cc;
        }
        .lighter {
            background-color: #fdebe7;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td class="top" colspan="3">First Frame: Name and address</td>
    </tr>

    <tr>
        <td class="light" colspan="2">
            Second frame<br><br>
            Bulleted list of qualifications
        </td>
        <td class="light">
            Third frame<br><br>
            Links to favourite sites
        </td>
    </tr>

    <tr>
        <td class="lighter">
            Fourth frame<br><br>
            Scrolling message
        </td>
        <td class="lighter">
            Fifth frame<br><br>
            Blinking reminders
        </td>
        <td class="lighter">
            Sixth frame<br><br>
            Image
        </td>
    </tr>
</table>

</body>
</html>
